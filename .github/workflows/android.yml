name: android
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "NO_KEY=1" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > android/app/release.jks
          {
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/android/app/release.jks"
            echo "KEYSTORE_PASS=$KS_PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASS=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build
        run: |
          if [ -n "$NO_KEY" ]; then
            gradle -p android assembleDebug --no-daemon
          else
            gradle -p android assembleRelease --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: shizuku-relay-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
